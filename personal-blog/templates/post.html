{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ site_owner.display_name if site_owner else '' }}{% endblock %}
{% block content %}

<article>
  <div class="post-header">
    <span class="postmark {{ 'draft' if not post.published }}">
      {{ post.created_at[:10] }}{% if not post.published %} · draft{% endif %}
    </span>
    <h1>{{ post.title }}</h1>
  </div>
  <div class="post-body">
    {{ html_content | safe }}
  </div>
</article>

<a class="back-link" href="{{ url_for('index') }}">&larr; back to journal</a>

{% endblock %}

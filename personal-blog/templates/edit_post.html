{% extends "base.html" %}
{% block title %}{{ 'Edit post' if post else 'New post' }}{% endblock %}
{% block content %}

<h1 style="font-family:var(--font-display);font-size:1.6rem;">{{ 'Edit post' if post else 'New post' }}</h1>

<form class="form-stack" method="post" style="margin-top:24px;">
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required>
  </div>
  <div class="field">
    <label for="category">Category (optional)</label>
    <input type="text" id="category" name="category" value="{{ post.category if post else '' }}" placeholder="e.g. Life, Travel, Recipes">
  </div>
  <div class="field">
    <label for="content">Content (Markdown supported)</label>
    <div class="editor-toolbar">
      <label for="image_upload" class="btn btn-secondary editor-upload-btn">
        🖼️ Insert image
      </label>
      <input type="file" id="image_upload" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none;">
      <span id="upload_status" class="upload-status"></span>
    </div>
    <textarea id="content" name="content" rows="16" required>{{ post.content if post else '' }}</textarea>
  </div>
  <label class="checkbox-row">
    <input type="checkbox" name="published" {% if not post or post.published %}checked{% endif %}>
    Published (uncheck to save as a private draft)
  </label>
  <div class="form-row">
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
  </div>
</form>

<script>
document.getElementById('image_upload').addEventListener('change', async function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const statusEl = document.getElementById('upload_status');
  const textarea = document.getElementById('content');
  statusEl.textContent = 'Uploading…';

  const formData = new FormData();
  formData.append('image', file);

  try {
    const response = await fetch("{{ url_for('upload_image') }}", {
      method: 'POST',
      body: formData
    });
    const data = await response.json();

    if (!response.ok) {
      statusEl.textContent = data.error || 'Upload failed.';
      return;
    }

    const snippet = `![${file.name}](${data.url})`;
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const before = textarea.value.slice(0, start);
    const after = textarea.value.slice(end);
    textarea.value = before + snippet + after;
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = start + snippet.length;

    statusEl.textContent = 'Image inserted ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2500);
  } catch (err) {
    statusEl.textContent = 'Upload failed — check your connection.';
  }

  e.target.value = '';
});
</script>

{% endblock %}
